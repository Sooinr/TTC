name: rotation-bot

# 20분마다 자동 실행 → 대시보드(index.html) 재생성 → 웹페이지에 반영
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:          # Actions 탭의 Run workflow 버튼으로 수동 실행도 가능

permissions:
  contents: write            # 계좌·기록 커밋 푸시용
  pages: write               # 대시보드 웹페이지 발행용
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 봇 파일을 어느 폴더에 올리든 자동으로 찾아 별도 work/ 폴더에서 실행
      - name: 봇 위치 찾기·복사
        run: |
          SRC=$(dirname "$(find . -name server_bot.py -not -path './.git/*' | head -1)")
          if [ ! -f "$SRC/server_bot.py" ]; then
            echo "::error::server_bot.py가 저장소에 없습니다. Code 탭 → Add file → Upload files 로 키트 파일을 업로드해 주세요."
            exit 1
          fi
          for f in universe_us.json make_dashboard.py; do
            if [ ! -f "$SRC/$f" ]; then
              echo "::error::$SRC 에 $f 없음 — server_bot.py와 같은 폴더에 함께 업로드해 주세요."
              exit 1
            fi
          done
          mkdir -p work
          cp "$SRC/server_bot.py" "$SRC/universe_us.json" "$SRC/make_dashboard.py" work/
          if [ -f settings.json ]; then cp settings.json work/; fi
          echo "봇 폴더: $SRC → work/ 에서 실행합니다"

      - name: 봇 1회 실행 (표준 라이브러리만 사용)
        run: cd work && python3 server_bot.py --once
        env:
          ALPACA_ID: ${{ secrets.ALPACA_ID }}
          ALPACA_SEC: ${{ secrets.ALPACA_SEC }}

      - name: 웹 대시보드 생성
        run: cd work && python3 make_dashboard.py

      - name: 계좌·기록을 저장소에 저장
        run: |
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add work/state.json work/trades.csv 2>/dev/null || true
          git add work/index.html
          if ! git diff --cached --quiet; then
            git commit -m "매매 기록·대시보드 갱신"
            git push
          fi

      - name: 웹페이지 발행 (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: work

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
