name: rotation-bot

# 20분마다 자동 실행 (미국 정규장에만 실제 매매 — 봇이 장중을 판단)
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:          # Actions 탭의 Run workflow 버튼으로 수동 실행도 가능

permissions:
  contents: write             # state.json/trades.csv를 저장소에 커밋해 두기 위함

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 저장소 파일 점검
        run: |
          ls -la
          if [ ! -f server_bot.py ] || [ ! -f universe_us.json ]; then
            echo "::error::server_bot.py 또는 universe_us.json이 저장소 맨 위에 없습니다. Code 탭에서 파일들이 폴더 없이 바로 보이는지 확인하고, 키트 파일들을 루트에 다시 업로드하세요."
            exit 1
          fi

      - name: 봇 1회 실행 (추가 설치 없음 — 표준 라이브러리만 사용)
        run: python3 server_bot.py --once
        env:
          ALPACA_ID: ${{ secrets.ALPACA_ID }}
          ALPACA_SEC: ${{ secrets.ALPACA_SEC }}

      - name: 계좌 상태·매매 기록 저장(커밋)
        run: |
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json trades.csv
          if ! git diff --cached --quiet; then
            git commit -m "매매 기록 갱신"
            git push
          fi
