name: rotation-bot

# 20분마다 자동 실행 (미국 정규장에만 실제 매매 — 봇이 장중을 판단)
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:          # Actions 탭의 Run workflow 버튼으로 수동 실행도 가능

permissions:
  contents: write             # state.json/trades.csv를 저장소에 커밋해 두기 위함

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 봇 1회 실행 (추가 설치 없음 — 표준 라이브러리만 사용)
        run: python3 server_bot.py --once
        env:
          ALPACA_ID: ${{ secrets.ALPACA_ID }}
          ALPACA_SEC: ${{ secrets.ALPACA_SEC }}

      - name: 계좌 상태·매매 기록 저장(커밋)
        run: |
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json trades.csv
          if ! git diff --cached --quiet; then
            git commit -m "매매 기록 갱신 $(date -u +%FT%TZ)"
            git push
          fi
