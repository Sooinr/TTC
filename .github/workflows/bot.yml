name: rotation-bot

# 장중에 한 번 시작하면 장 마감까지 자동 운영 + Run workflow 폼에서 시작/정지·설정 (개인 토큰 불필요)
on:
  schedule:
    - cron: "*/1 * * * *"           # 보조일 뿐 — 최근 깃허브가 예약 실행을 자주 누락. 실제 운전은 아래 루프 담당
  workflow_dispatch:
    inputs:
      enabled:
        description: "봇 상태"
        type: choice
        options: [변경 안 함, 시작, 정지]
        default: 변경 안 함
      top_n:
        description: "보유 종목 수"
        type: choice
        options: [변경 안 함, 2, 3, 4, 5, 6, 7, 8]
        default: 변경 안 함
      rebal_min:
        description: "리밸런스 주기(분)"
        type: choice
        options: [변경 안 함, 10, 15, 20, 30, 60]
        default: 변경 안 함
      stop_pct:
        description: "손절 %"
        type: choice
        options: [변경 안 함, 3, 5, 8, 10, 12, 15]
        default: 변경 안 함
      take_pct:
        description: "익절 %"
        type: choice
        options: [변경 안 함, 3, 5, 8, 10, 12, 15]
        default: 변경 안 함
      trail_pct:
        description: "트레일링 %"
        type: choice
        options: [변경 안 함, 3, 4, 5, 7, 10]
        default: 변경 안 함

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true        # 새 실행이 시작되면 밀린 이전 실행을 정리 (기록은 매 사이클 즉시 커밋되므로 안전)

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 봇 위치 찾기·복사
        run: |
          SRC=$(dirname "$(find . -name server_bot.py -not -path './.git/*' -not -path './work/*' | head -1)")
          if [ ! -f "$SRC/server_bot.py" ]; then
            echo "::error::server_bot.py가 저장소에 없습니다. Code 탭 → Add file → Upload files 로 업로드해 주세요."
            exit 1
          fi
          for f in universe_us.json make_dashboard.py; do
            [ -f "$SRC/$f" ] || { echo "::error::$SRC 에 $f 없음 — 함께 업로드해 주세요."; exit 1; }
          done
          mkdir -p work
          if [ "$SRC" != "work" ]; then
            cp "$SRC/server_bot.py" "$SRC/universe_us.json" "$SRC/make_dashboard.py" work/
            [ -f "$SRC/settings.json" ] && cp "$SRC/settings.json" work/ || true
          fi
          echo "봇 폴더: $SRC → work/ 에서 실행합니다"

      - name: 대시보드 설정 반영
        run: |
          python3 - <<'PY'
          import json, os
          p = os.path.join("work", "settings.json")
          try:
              cfg = json.load(open(p, encoding="utf-8"))
          except Exception:
              cfg = {"enabled": True, "top_n": 4, "rebal_min": 20, "stop": -0.08, "take": 0.08, "trail": 0.05}
          e = {k: os.environ.get(k, "") for k in ("I_EN", "I_TOP", "I_REB", "I_STOP", "I_TAKE", "I_TRAIL")}
          if e["I_EN"] in ("시작", "정지"):
              cfg["enabled"] = e["I_EN"] == "시작"
          if e["I_TOP"] not in ("변경 안 함", ""):
              cfg["top_n"] = int(e["I_TOP"])
          if e["I_REB"] not in ("변경 안 함", ""):
              cfg["rebal_min"] = int(e["I_REB"])
          if e["I_STOP"] not in ("변경 안 함", ""):
              cfg["stop"] = -abs(float(e["I_STOP"])) / 100
          if e["I_TAKE"] not in ("변경 안 함", ""):
              cfg["take"] = abs(float(e["I_TAKE"])) / 100
          if e["I_TRAIL"] not in ("변경 안 함", ""):
              cfg["trail"] = abs(float(e["I_TRAIL"])) / 100
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("적용된 설정:", cfg)
          PY
        env:
          I_EN: ${{ github.event.inputs.enabled }}
          I_TOP: ${{ github.event.inputs.top_n }}
          I_REB: ${{ github.event.inputs.rebal_min }}
          I_STOP: ${{ github.event.inputs.stop_pct }}
          I_TAKE: ${{ github.event.inputs.take_pct }}
          I_TRAIL: ${{ github.event.inputs.trail_pct }}

      - name: 봇 루프 실행 (장 마감까지 1분 간격 — 매 사이클 시세·기록 즉시 커밋)
        run: |
          cd work
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          while :; do
            python3 server_bot.py --once || echo "[경고] 사이클 비정상 종료 — 다음 사이클에서 재시도"
            python3 make_dashboard.py || true
            cd ..
            for f in state.json trades.csv settings.json quotes.json index.html; do
              git add "work/$f" 2>/dev/null || true
            done
            if ! git diff --cached --quiet; then
              git commit -m "매매 기록·갱신" || true
              git push || (git pull --rebase origin main 2>/dev/null || true; git push || true)
            fi
            cd work
            EN=$(python3 -c "import json;print(json.load(open('settings.json')).get('enabled', True))" 2>/dev/null || echo True)
            D=$(TZ=America/New_York date +%u); H=$(TZ=America/New_York date +%H%M)
            if [ "$EN" = "False" ]; then echo "[종료] 대시보드에서 정지 선택됨"; break; fi
            if [ "$D" -ge 6 ] || [ "$H" -ge 1600 ]; then echo "[종료] 미국 장 마감 — 다음 거래일에 다시 시작해 주세요"; break; fi
            if [ $(( $(date +%s) - START )) -gt 18600 ]; then echo "[종료] 최대 실행 시간 도달"; break; fi
            sleep 55
          done
        env:
          ALPACA_ID: ${{ secrets.ALPACA_ID }}
          ALPACA_SEC: ${{ secrets.ALPACA_SEC }}

      - name: 웹 대시보드 생성
        run: cd work && python3 make_dashboard.py

      # 기록 파일만 커밋 — 봇 스크립트 복사본은 저장소에 다시 안 올림(다음 실행 오류 방지)
      - name: 계좌·기록 저장(커밋)
        run: |
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm --cached work/server_bot.py work/universe_us.json work/make_dashboard.py 2>/dev/null || true
          for f in state.json trades.csv index.html settings.json quotes.json; do
            git add "work/$f" 2>/dev/null || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "매매 기록·대시보드 갱신"
            git push
          fi

      - name: 웹페이지 발행 (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: work

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
